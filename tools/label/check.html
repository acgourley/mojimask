<!doctype html>
<html><head><meta charset="utf-8"><title>Focused check</title>
<style>
  :root { --bg:#16181c; --panel:#20232a; --fg:#e8e8e8; --dim:#9aa0aa; --ok:#4cc38a; --warn:#f0a020; --blue:#7aa7ff; --target:#ffd400; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:15px -apple-system,system-ui,sans-serif; }
  #top { padding:10px 16px; background:var(--panel); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  #bar { flex:1; height:8px; background:#333842; border-radius:4px; min-width:200px; }
  #bar div { height:100%; background:var(--ok); border-radius:4px; }
  #card { padding:16px; max-width:1200px; margin:0 auto; }
  .q { font-size:22px; font-weight:600; margin:4px 0 2px; }
  .sub { color:var(--dim); margin-bottom:12px; }
  .row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .pic { text-align:center; }
  .pic canvas { border-radius:6px; display:block; background:#000; }
  .pic .cap { color:var(--dim); font-size:12px; margin-top:4px; }
  .group { background:var(--panel); border-radius:8px; padding:10px; }
  .group h4 { margin:0 0 8px; font-size:13px; color:var(--dim); font-weight:500; }
  .people { display:flex; gap:12px; flex-wrap:wrap; }
  .person { cursor:pointer; border-radius:8px; padding:6px; border:2px solid transparent; }
  .person:hover { border-color:var(--blue); }
  .person .imgs { display:flex; gap:4px; }
  .person .cap { text-align:center; color:var(--dim); font-size:12px; margin-top:4px; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button { background:#2b2f38; color:var(--fg); border:1px solid #3a3f4a; border-radius:8px; padding:10px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.primary { background:#245c40; border-color:#2f7a55; }
  button kbd { margin-left:8px; }
  kbd { background:#3a3f4a; border-radius:3px; padding:1px 6px; font:12px ui-monospace,monospace; color:var(--fg); }
  .nots { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .nots .pic { cursor:pointer; }
  .nots canvas.on { outline:3px solid var(--ok); }
  #msg { color:var(--blue); min-height:20px; }
  .legend { color:var(--dim); font-size:13px; margin-top:6px; }
  .legend b { color:var(--target); }
</style></head>
<body>
<div id="top"><b>Focused check</b><span id="count"></span><div id="bar"><div></div></div><span id="msg"></span></div>
<div id="card"></div>
<script>
const $ = s => document.querySelector(s);
let D, TR, Q = [], pos = 0, W, H, frames = new Map(), checked = new Set(), drafted = new Set(), edited = new Set();
const done = new Map();
const audit = [];  // this session's audit answers not yet saved (save() moves them into D.truth.audit)
let audit0 = 0;    // how many audit entries the truth file had when this page opened
let selNots = new Set(), choices = [], current = null;
const cache = new Map();
function img(t) { if (!cache.has(t)) { const i = new Image(); i.src = `/frame/${t}.jpg`; cache.set(t, i); } return cache.get(t); }

async function init() {
  D = await (await fetch('/api/init')).json();
  TR = await (await fetch('/api/triage')).json();
  W = D.w; H = D.h;
  for (const [k, list] of Object.entries(D.truth.frames)) frames.set(+k, list.map(o => ({ ...o, b: [o.b[0] * W, o.b[1] * H, o.b[2] * W, o.b[3] * H] })));
  audit0 = (D.truth.audit || []).length;
  (D.truth.checked || []).forEach(k => checked.add(+k));
  (D.truth.drafted || []).forEach(k => drafted.add(+k));
  (D.truth.edited || []).forEach(k => edited.add(+k));
  Q = TR.items.filter(x => drafted.has(x.t));
  show();
}

// a close-up around box b of frame t, the box outlined
function crop(t, b, size, scale = 2.4, color = '#ffd400', width = 3) {
  const cv = document.createElement('canvas'), im = img(t), ctx = cv.getContext('2d');
  cv.width = cv.height = size;
  const paint = () => {
    const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, s = Math.max(b[2] - b[0], b[3] - b[1]) * scale;
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
    ctx.drawImage(im, cx - s / 2, cy - s / 2, s, s, 0, 0, size, size);
    if (color) { const k = size / s; ctx.strokeStyle = color; ctx.lineWidth = width; ctx.strokeRect((b[0] - cx + s / 2) * k, (b[1] - cy + s / 2) * k, (b[2] - b[0]) * k, (b[3] - b[1]) * k); }
  };
  im.complete ? paint() : im.addEventListener('load', paint, { once: true });
  return cv;
}
// the whole frame, every box dim, the one asked about thick and yellow
function wholeFrame(t, target, width) {
  const cv = document.createElement('canvas'), im = img(t), sc = width / W;
  cv.width = W * sc; cv.height = H * sc;
  const paint = () => {
    const x = cv.getContext('2d'); x.drawImage(im, 0, 0, cv.width, cv.height);
    for (const o of frames.get(t)) { if (o === target) continue; x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = 1; x.strokeRect(o.b[0] * sc, o.b[1] * sc, (o.b[2] - o.b[0]) * sc, (o.b[3] - o.b[1]) * sc); }
    x.strokeStyle = '#ffd400'; x.lineWidth = 4;
    x.strokeRect(target.b[0] * sc - 3, target.b[1] * sc - 3, (target.b[2] - target.b[0]) * sc + 6, (target.b[3] - target.b[1]) * sc + 6);
  };
  im.complete ? paint() : im.addEventListener('load', paint, { once: true });
  return cv;
}
function pic(canvas, caption) { const d = document.createElement('div'); d.className = 'pic'; d.append(canvas); const c = document.createElement('div'); c.className = 'cap'; c.textContent = caption; d.append(c); return d; }
// up to n earlier pictures of person p (labelled frames before t), spread out, latest last
function views(p, t, n = 3) {
  const v = [];
  for (const [k, L] of [...frames].sort((a, b) => a[0] - b[0])) { if (k >= t) break; for (const o of L) if (o.p === p && o.c !== 'not') v.push([k, o.b]); }
  if (v.length <= n) return v;
  return [...Array(n).keys()].map(i => v[Math.round(i * (v.length - 1) / (n - 1))]);
}
function personTile(p, t, caption, onclick, best) {
  const d = document.createElement('div'); d.className = 'person';
  const imgs = document.createElement('div'); imgs.className = 'imgs';
  for (const [k, b] of (best && best.length ? best.map(v => [v.t, v.b]) : views(p, t, 2))) imgs.append(crop(k, b, 100, 2.2, null));
  d.append(imgs); const c = document.createElement('div'); c.className = 'cap'; c.textContent = caption; d.append(c);
  d.onclick = onclick; return d;
}
function nextPerson() { let m = 0; for (const L of frames.values()) for (const b of L) if (b.p != null) m = Math.max(m, b.p); return m + 1; }
function button(text, key, fn, primary) {
  const b = document.createElement('button'); if (primary) b.className = 'primary';
  b.innerHTML = text + (key ? ` <kbd>${key}</kbd>` : ''); b.onclick = fn; return b;
}

function show() {
  const total = Q.length;
  $('#count').textContent = pos < total ? `${pos + 1} of ${total}` : `all ${total} done`;
  $('#bar div').style.width = (100 * Math.min(pos, total) / Math.max(1, total)) + '%';
  const el = $('#card'); el.innerHTML = ''; selNots = new Set(); choices = [];
  const ses = (D.truth.audit || []).slice(audit0).concat(audit);  // this session's audit answers, saved or not
  if (pos >= total) { el.innerHTML = `<p class="q">Done.</p><p>Every frame you went through is now checked. Audit: ${ses.filter(a => a.ok).length} of ${ses.length} automatically accepted boxes were right.</p><p><a href="/" style="color:var(--blue)">Back to the label tool</a></p>`; save(); return; }
  const it = Q[pos];
  if (it.kind === 'frame') return showFrame(it, el);
  const o = frames.get(it.t)[it.i];
  const known = o.p != null && views(o.p, it.t).length > 0;
  const reasons = it.why.join(' ');
  // the question, in plain words, by what is uncertain
  let q, sub, mode;
  if (o.src === 'carried') { mode = 'carried'; q = 'Is this person still here, in the yellow box?'; sub = 'No detector found a head here in this frame; the box was carried over from the frame before.'; }
  else if (/new person/.test(reasons) || !known) { mode = 'new'; q = 'Have you seen this person before?'; sub = 'The person in the yellow box looks new. If they appeared earlier, click their pictures below.'; }
  else if (/weak detection/.test(reasons) && !/same|match|moved|another/.test(reasons)) { mode = 'same'; q = 'Is the yellow box on the same person as in these pictures?'; sub = 'The detector was unsure about this one.'; }
  else { mode = 'same'; q = 'Is the yellow box on the same person as in these pictures?'; sub = it.kind === 'audit' ? 'A random check of a box that was accepted automatically.' : reasons.replace(/P\d+/g, 'this person'); }
  current = { it, o, mode };
  el.insertAdjacentHTML('beforeend', `<div class="q">${q}</div><div class="sub">Frame ${it.t}. ${sub}</div>`);
  const row = document.createElement('div'); row.className = 'row';
  const now = document.createElement('div'); now.className = 'group';
  now.innerHTML = '<h4>Now — the <b style="color:var(--target)">yellow box</b> is the one being asked about</h4>';
  const r1 = document.createElement('div'); r1.className = 'row';
  r1.append(pic(crop(it.t, o.b, 260), 'close up'), pic(wholeFrame(it.t, o, 360), 'where it is in the frame'));
  now.append(r1); row.append(now);
  if (known && mode !== 'new') {
    const before = document.createElement('div'); before.className = 'group';
    before.innerHTML = '<h4>Earlier pictures of the person it was matched to (their clearest)</h4>';
    const r2 = document.createElement('div'); r2.className = 'row';
    const best = (it.views && it.views.length && it.p === o.p) ? it.views.map(v => [v.t, v.b]) : views(o.p, it.t);
    for (const [k, b] of best) r2.append(pic(crop(k, b, 150, 2.2, null), `frame ${k}`));
    before.append(r2); row.append(before);
  }
  el.append(row);
  // other people it could be: pictures, numbered 1-4 for the keyboard
  const cands = (it.near || []).filter(c => c.p !== o.p).slice(0, 4);
  if (cands.length) {
    const g = document.createElement('div'); g.className = 'group'; g.style.marginTop = '14px';
    g.innerHTML = `<h4>${mode === 'new' ? 'Is it one of these people seen earlier? Click them, or press their number' : 'If it is someone else: is it one of these? Click them, or press their number'}</h4>`;
    const ppl = document.createElement('div'); ppl.className = 'people';
    cands.forEach((c, k) => { choices.push(c.p); ppl.append(personTile(c.p, it.t, `${k + 1}`, () => answer({ p: c.p }), c.views)); });
    g.append(ppl); el.append(g);
  }
  const bt = document.createElement('div'); bt.className = 'buttons';
  if (mode === 'new') {
    bt.append(button('Yes, a new person (not seen before)', 'Enter', () => answer({ ok: true }), true));
  } else if (mode === 'carried') {
    bt.append(button('Yes, same person, still there', 'Enter', () => answer({ ok: true }), true));
    bt.append(button('No head in the yellow box', 'D', () => answer({ del: true })));
    bt.append(button('Someone new', 'N', () => answer({ newp: true })));
  } else {
    bt.append(button('Yes, same person', 'Enter', () => answer({ ok: true }), true));
    bt.append(button('No — someone new', 'N', () => answer({ newp: true })));
  }
  bt.append(button('Not a head', 'X', () => answer({ c: 'not' })));
  bt.append(button('A head, but the face isn\'t visible', 'H', () => answer({ c: 'head' })));
  if (mode !== 'carried') bt.append(button('No head here, remove the box', 'D', () => answer({ del: true })));
  bt.append(button('Back', '⌫', back));
  el.append(bt);
}

function showFrame(it, el) {
  const L = frames.get(it.t);
  el.innerHTML = `<div class="q">Frame ${it.t}: one look at the whole frame</div>
    <div class="sub">1) Is any face <b>missing</b> a box? &nbsp; 2) The dashed grey boxes are marked "not a head": click any below that <b>is</b> a head.</div>`;
  const c = document.createElement('canvas'), im = img(it.t), sc = Math.min(1100 / W, 700 / H);
  c.width = W * sc; c.height = H * sc; c.style.borderRadius = '6px';
  const paint = () => {
    const x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height); x.font = '600 13px system-ui';
    L.forEach((b, i) => {
      const nt = b.c === 'not', sel = selNots.has(i);
      x.strokeStyle = nt ? (sel ? '#4cc38a' : 'rgba(200,200,200,.85)') : '#4cc38a'; x.lineWidth = nt && !sel ? 1.5 : 2.5;
      x.setLineDash(nt && !sel ? [5, 4] : []); x.strokeRect(b.b[0] * sc, b.b[1] * sc, (b.b[2] - b.b[0]) * sc, (b.b[3] - b.b[1]) * sc); x.setLineDash([]);
      if (nt) { x.fillStyle = '#ddd'; x.fillText(`${it.nots.findIndex(n => n.i === i) + 1}`, b.b[0] * sc + 2, b.b[1] * sc - 4); }
    });
  };
  im.complete ? paint() : im.addEventListener('load', paint, { once: true });
  el.append(c);
  el.insertAdjacentHTML('beforeend', '<div class="legend">Green: a person. Dashed grey, numbered: marked "not a head".</div>');
  const strip = document.createElement('div'); strip.className = 'nots';
  it.nots.forEach((n, k) => {
    const p = pic(crop(it.t, L[n.i].b, 96, 2.2, '#ccc', 1), `${k + 1}`);
    p.onclick = () => { selNots.has(n.i) ? selNots.delete(n.i) : selNots.add(n.i); p.querySelector('canvas').classList.toggle('on'); paint(); };
    strip.append(p);
  });
  el.append(strip);
  const bt = document.createElement('div'); bt.className = 'buttons';
  bt.append(button('Frame is right (clicked ones become heads)', 'Enter', () => answer({}), true));
  bt.append(button('A face has no box: fix it later in the label tool', 'M', () => answer({ missing: true })));
  bt.append(button('Back', '⌫', back));
  el.append(bt);
}

function answer(a) {
  const it = Q[pos], L = frames.get(it.t);
  if (it.kind === 'frame') {
    for (const i of selNots) { L[i].c = 'face'; L[i].p = nextPerson(); L[i].by = 'person'; }
    if (a.missing) { msg(`Frame ${it.t} left for the label tool (a face has no box).`); }
    else { checked.add(it.t); drafted.delete(it.t); }
    done.set(pos, { a }); pos++; save(); return show();
  }
  const o = L[it.i], before = { ...o };
  if (a.p != null) { o.p = a.p; if (o.c === 'not') o.c = 'face'; }
  if (a.newp) { o.p = nextPerson(); if (o.c === 'not') o.c = 'face'; }
  if (a.c) { o.c = a.c; if (a.c === 'not') o.p = null; }
  if (a.del) { L.splice(it.i, 1); Q.forEach(q => { if (q.t === it.t && q.i > it.i) q.i--; if (q.kind === 'frame' && q.t === it.t) q.nots.forEach(n => { if (n.i > it.i) n.i--; }); }); }
  if (!a.del && !a.ok) o.by = 'person';
  if (it.kind === 'audit') audit.push({ t: it.t, i: it.i, ok: !!a.ok });
  done.set(pos, { a, before, audited: it.kind === 'audit' });
  pos++; save(); show();
}
// Back undoes a box answer (the box as it was, its audit entry). A removed box or a frame answer can't be undone here:
// removing shifted the frame's indexes, and a frame answer changed several boxes.
function back() {
  if (pos === 0) return;
  const d = done.get(pos - 1), it = Q[pos - 1];
  if (d && (it.kind === 'frame' || d.a.del)) return msg(`Back can't undo that one (${it.kind === 'frame' ? 'a frame answer' : 'a removed box'}): fix frame ${it.t} in the label tool.`);
  pos--;
  if (d) {
    frames.get(it.t)[it.i] = d.before;
    if (d.audited) { if (audit.length) audit.pop(); else (D.truth.audit || []).pop(); }
    done.delete(pos); save();
  }
  show();
}
function msg(s) { $('#msg').textContent = s; setTimeout(() => { if ($('#msg').textContent === s) $('#msg').textContent = ''; }, 4000); }

async function save() {
  const out = { frames: {}, checked: [...checked].sort((a, b) => a - b), edited: [...edited].sort((a, b) => a - b),
                drafted: [...drafted].sort((a, b) => a - b), audit: (D.truth.audit || []).concat(audit.splice(0)) };
  D.truth.audit = out.audit;
  for (const [k, L] of frames) out.frames[k] = L.map(b => ({ ...b, b: [b.b[0] / W, b.b[1] / H, b.b[2] / W, b.b[3] / H].map(v => +v.toFixed(5)) }));
  try { const r = await fetch('/api/save', { method: 'POST', body: JSON.stringify(out) }); if (!r.ok) throw 0; }
  catch (e) { msg('NOT SAVED: is the label server running?'); }
}

window.addEventListener('keydown', e => {
  if (pos >= Q.length) return;
  const it = Q[pos], k = e.key.toLowerCase();
  if (e.key === 'Backspace') { back(); e.preventDefault(); return; }
  if (it.kind === 'frame') { if (e.key === 'Enter') answer({}); else if (k === 'm') answer({ missing: true }); return; }
  if (/^[1-4]$/.test(e.key) && choices[+e.key - 1] != null) { answer({ p: choices[+e.key - 1] }); return; }
  if (e.key === 'Enter') { answer({ ok: true }); return; }
  const m = { n: { newp: true }, x: { c: 'not' }, h: { c: 'head' }, d: { del: true } }[k];
  if (m) answer(m);
});
init();
</script>
</body></html>
