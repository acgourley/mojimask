<!doctype html>
<html><head><meta charset="utf-8"><title>Grade the result</title>
<style>
  :root { --bg:#16181c; --panel:#20232a; --fg:#e8e8e8; --dim:#9aa0aa; --ok:#4cc38a; --bad:#ff5a5a; --target:#ffd400; --blue:#7aa7ff; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font:15px -apple-system,system-ui,sans-serif; }
  #top { padding:10px 16px; background:var(--panel); display:flex; gap:16px; align-items:center; }
  #bar { flex:1; height:8px; background:#333842; border-radius:4px; }
  #bar div { height:100%; background:var(--ok); border-radius:4px; }
  #card { padding:16px; max-width:1250px; margin:0 auto; }
  .q { font-size:22px; font-weight:600; margin:4px 0 2px; }
  .sub { color:var(--dim); margin-bottom:12px; }
  .strip { display:flex; gap:8px; flex-wrap:wrap; }
  .pic { position:relative; text-align:center; cursor:pointer; }
  .pic canvas { border-radius:6px; display:block; background:#000; border:3px solid transparent; }
  .pic.other canvas { border-color:var(--bad); }
  .pic.not canvas { border-color:#888; opacity:.5; }
  .pic .tag { position:absolute; top:6px; left:6px; right:6px; font-size:12px; font-weight:600; padding:2px 4px; border-radius:4px; display:none; }
  .pic.other .tag { display:block; background:var(--bad); }
  .pic.not .tag { display:block; background:#666; }
  .pic .cap { color:var(--dim); font-size:12px; margin-top:3px; }
  .side { background:var(--panel); border-radius:8px; padding:10px; }
  .side h4 { margin:0 0 8px; color:var(--dim); font-weight:500; font-size:13px; }
  .row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .buttons { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button { background:#2b2f38; color:var(--fg); border:1px solid #3a3f4a; border-radius:8px; padding:10px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--blue); }
  button.primary { background:#245c40; border-color:#2f7a55; }
  kbd { background:#3a3f4a; border-radius:3px; padding:1px 6px; font:12px ui-monospace,monospace; margin-left:8px; }
  #frame { cursor:crosshair; border-radius:6px; }
</style></head>
<body>
<div id="top"><b>Grade the result</b><span id="count"></span><div id="bar"><div></div></div><span id="msg" style="color:#ff6b6b;font-weight:600"></span></div>
<div id="card"></div>
<script>
const $ = s => document.querySelector(s);
let G, cards = [], pos = 0, ans = { people: {}, questions: {}, glance: {} };
const cache = new Map();
function img(t) { if (!cache.has(t)) { const i = new Image(); i.src = `/frame/${t}.jpg`; cache.set(t, i); } return cache.get(t); }
function crop(t, b, size, color = '#ffd400') {
  const cv = document.createElement('canvas'), im = img(t), x = cv.getContext('2d'); cv.width = cv.height = size;
  const paint = () => { const cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, s = Math.max(b[2] - b[0], b[3] - b[1]) * 2.2;
    x.fillStyle = '#000'; x.fillRect(0, 0, size, size); x.drawImage(im, cx - s / 2, cy - s / 2, s, s, 0, 0, size, size);
    const k = size / s; x.strokeStyle = color; x.lineWidth = 2; x.strokeRect((b[0] - cx + s / 2) * k, (b[1] - cy + s / 2) * k, (b[2] - b[0]) * k, (b[3] - b[1]) * k); };
  im.complete ? paint() : im.addEventListener('load', paint, { once: true }); return cv;
}
function button(text, key, fn, primary) { const b = document.createElement('button'); if (primary) b.className = 'primary'; b.innerHTML = text + (key ? `<kbd>${key}</kbd>` : ''); b.onclick = fn; return b; }

async function init() {
  G = await (await fetch('/api/grade_data')).json();
  const saved = await (await fetch('/api/grade_load')).json();
  if (saved && saved.people) ans = { ...ans, ...saved };  // an older file may lack a section
  cards = [...G.people.map(p => ({ kind: 'person', p })), ...G.questions.map((q, i) => ({ kind: 'question', q, i })), ...G.glance.map(g => ({ kind: 'glance', g }))];
  if (location.search.includes('glance')) { cards = cards.filter(c => c.kind === 'glance'); pos = 0; }   // redo just the frames
  else { pos = cards.findIndex(c => !answered(c)); if (pos < 0) pos = cards.length; }
  show();
}
function answered(c) { return c.kind === 'person' ? ans.people[c.p.id] : c.kind === 'question' ? ans.questions[c.i] : ans.glance[c.g.t]; }

function show() {
  $('#count').textContent = pos < cards.length ? `${pos + 1} of ${cards.length}` : `all ${cards.length} done`;
  $('#bar div').style.width = (100 * Math.min(pos, cards.length) / cards.length) + '%';
  const el = $('#card'); el.innerHTML = '';
  if (pos >= cards.length) { el.innerHTML = '<p class="q">Done — thank you.</p><p>Your grades are saved.</p>'; return; }
  const c = cards[pos];
  if (c.kind === 'person') return showPerson(c, el);
  if (c.kind === 'question') return showQuestion(c, el);
  return showGlance(c, el);
}

function showPerson(c, el) {
  const prev = ans.people[c.p.id] || { flags: {} }, flags = { ...prev.flags };
  el.innerHTML = `<div class="q">Is every picture the same person?</div>
    <div class="sub">One person the algorithm found, over frames ${c.p.first}–${c.p.last} (${c.p.n} detections). Click a picture that is <b>someone else</b>; click again for <b>not a head</b>; again to clear.</div>`;
  const strip = document.createElement('div'); strip.className = 'strip';
  for (const v of c.p.pictures) {
    const d = document.createElement('div'); d.className = 'pic';
    d.append(crop(v.t, v.b, 150)); d.insertAdjacentHTML('beforeend', `<div class="tag"></div><div class="cap">frame ${v.t}</div>`);
    const set = () => { d.className = 'pic ' + (flags[v.t] || ''); d.querySelector('.tag').textContent = flags[v.t] === 'other' ? 'someone else' : flags[v.t] === 'not' ? 'not a head' : ''; };
    d.onclick = () => { flags[v.t] = flags[v.t] === undefined ? 'other' : flags[v.t] === 'other' ? 'not' : undefined; if (!flags[v.t]) delete flags[v.t]; set(); };
    set(); strip.append(d);
  }
  el.append(strip);
  const bt = document.createElement('div'); bt.className = 'buttons';
  const nflag = () => Object.keys(flags).length;
  bt.append(button('Done with this person', 'Enter', () => { ans.people[c.p.id] = { flags, n: c.p.pictures.length }; next(); }, true));
  bt.append(button('Back', '⌫', back));
  el.append(bt);
  window._enter = () => { ans.people[c.p.id] = { flags, n: c.p.pictures.length }; next(); };
}

function showQuestion(c, el) {
  el.innerHTML = `<div class="q">Are these the same person?</div><div class="sub">A question the algorithm would ask you (${c.q.why}).</div>`;
  const row = document.createElement('div'); row.className = 'row';
  for (const [title, pics] of [['First', c.q.a_pics], ['Second', c.q.b_pics]]) {
    const s = document.createElement('div'); s.className = 'side'; s.innerHTML = `<h4>${title}</h4>`;
    const st = document.createElement('div'); st.className = 'strip';
    for (const v of pics) { const d = document.createElement('div'); d.className = 'pic'; d.append(crop(v.t, v.b, 140)); d.insertAdjacentHTML('beforeend', `<div class="cap">frame ${v.t}</div>`); st.append(d); }
    s.append(st); row.append(s);
  }
  el.append(row);
  const bt = document.createElement('div'); bt.className = 'buttons';
  const put = a => { ans.questions[c.i] = a; next(); };
  bt.append(button('Yes, same person', 'Y', () => put('same'), true));
  bt.append(button('No, different people', 'N', () => put('different')));
  bt.append(button("Can't tell", 'C', () => put('unsure')));
  bt.append(button('Back', '⌫', back));
  el.append(bt);
  window._keys = { y: () => put('same'), n: () => put('different'), c: () => put('unsure') };
}

function showGlance(c, el) {
  const prev = ans.glance[c.g.t] || {};
  const marks = (prev.missing || []).map(m => m.length === 2 ? [m[0], m[1], 'face'] : m);   // [x, y, 'face' | 'head']
  const wrong = new Set(prev.not_face || []);   // indexes of boxes marked "not a face"
  const boxes = [...c.g.people.map(o => ({ ...o, kind: 'person' })), ...c.g.other.map(o => ({ ...o, kind: 'other' }))];
  el.innerHTML = `<div class="q">Frame ${c.g.t}: anything wrong in this frame?</div>
    <div class="sub"><b>Click a box</b> that isn't on a face to mark it <b>not a face</b> (click again to undo).
    <b>Click a face with no box</b> to mark it missing; click the mark again to change it to <b>head, face not visible</b>; again to remove.<br>
    Green: people the algorithm found. Grey dashed: boxes it covers but doesn't count as people.</div>`;
  const cv = document.createElement('canvas'); cv.id = 'frame'; const im = img(c.g.t);
  const paint = () => {
    const W = im.naturalWidth, H = im.naturalHeight, sc = Math.min(1150 / W, 1250 / H); cv.width = W * sc; cv.height = H * sc; cv._sc = sc;
    const x = cv.getContext('2d'); x.drawImage(im, 0, 0, cv.width, cv.height);
    boxes.forEach((o, i) => {
      const bad = wrong.has(i);
      x.lineWidth = bad ? 3 : 2; x.setLineDash(o.kind === 'other' && !bad ? [4, 3] : []);
      x.strokeStyle = bad ? '#ff5a5a' : o.kind === 'person' ? '#4cc38a' : 'rgba(200,200,200,.8)';
      x.strokeRect(o.b[0] * sc, o.b[1] * sc, (o.b[2] - o.b[0]) * sc, (o.b[3] - o.b[1]) * sc); x.setLineDash([]);
      if (bad) { x.fillStyle = '#ff5a5a'; x.font = '600 12px system-ui'; x.fillText('not a face', o.b[0] * sc, o.b[1] * sc - 4); }
    });
    for (const [mx, my, k] of marks) { x.strokeStyle = k === 'face' ? '#ff5a5a' : '#f0a020'; x.lineWidth = 3; x.beginPath(); x.arc(mx * sc, my * sc, 16, 0, 7); x.stroke();
      x.fillStyle = x.strokeStyle; x.font = '600 12px system-ui'; x.fillText(k === 'face' ? 'missing face' : 'head (no face)', mx * sc + 18, my * sc); }
  };
  im.complete ? paint() : im.addEventListener('load', paint, { once: true });
  cv.onclick = e => {
    const r = cv.getBoundingClientRect(), sc = cv._sc, px = (e.clientX - r.left) / sc, py = (e.clientY - r.top) / sc;
    const mi = marks.findIndex(([mx, my]) => Math.hypot(mx - px, my - py) < 20 / sc);
    if (mi >= 0) { if (marks[mi][2] === 'face') marks[mi][2] = 'head'; else marks.splice(mi, 1); return paint(); }
    const bi = boxes.findIndex(o => px >= o.b[0] && px <= o.b[2] && py >= o.b[1] && py <= o.b[3]);
    if (bi >= 0) { wrong.has(bi) ? wrong.delete(bi) : wrong.add(bi); return paint(); }
    marks.push([Math.round(px), Math.round(py), 'face']); paint();
  };
  el.append(cv);
  const done = () => { ans.glance[c.g.t] = { missing: marks, not_face: [...wrong], boxes: boxes.map(o => ({ b: o.b, kind: o.kind, g: o.g })) }; next(); };
  const bt = document.createElement('div'); bt.className = 'buttons';
  bt.append(button('Done with this frame', 'Enter', done, true));
  bt.append(button('Back', '⌫', back));
  el.append(bt);
  window._enter = done;
}

function next() { pos++; save(); window._enter = null; window._keys = null; show(); }
function back() { if (pos > 0) { pos--; window._enter = null; window._keys = null; show(); } }
async function save() {
  try { const r = await fetch('/api/grade_save', { method: 'POST', body: JSON.stringify(ans) }); if (!r.ok) throw 0; $('#msg').textContent = ''; }
  catch (e) { $('#msg').textContent = 'NOT SAVED: is the label server running?'; }
}
window.addEventListener('keydown', e => {
  if (e.key === 'Backspace') { back(); e.preventDefault(); return; }
  if (e.key === 'Enter' && window._enter) { window._enter(); return; }
  const f = window._keys && window._keys[e.key.toLowerCase()]; if (f) f();
});
init();
</script>
</body></html>
