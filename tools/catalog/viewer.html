<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen catalog</title>
<!--
  The screen catalog's viewer (tools/catalog/run.py copies it into each run as index.html; it opens from disk).
  Paths on the left, each step of the chosen one below them. A step: its screen, and beside it every string on it,
  with how it fits at the chosen size in words (the other size noted where it differs); problems outlined on the
  screen, and hovering a string on either side lights it on the other. Screenshot: exactly what WebKit drew. Live HTML:
  the page as captured, drawn by this browser, every string editable in place and measured again ("Your edits" copies
  them for a drafts file). Keys: every strings.js key the run reached and the steps it appears on. ← / → step through.
  Data: data.js (window.CATALOG), one <path>/<nn>-<size>.snap.js per captured screen (loaded when shown),
  measure.js (the measurement run.py made at capture, run again live), web/ (the app's fonts and pictures).
-->
<style>
  :root { color-scheme: dark; --bg:#0D0B17; --bar:#131022; --panel:#15121F; --deep:#0A0812; --raised:#221D36; --line:#2A2540; --line2:#4A4273;
          --text:#fff; --soft:#C9C4DB; --dim:#9A93B0; --faint:#6F6988; --accent:#FFD23F; --good:#3DDC84; --warn:#F5A524; --bad:#FF6B6B; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--deep); border: 1px solid var(--line); border-radius: 9px; }
  .seg button, button { font: 500 13px inherit; color: var(--soft); background: transparent; border: 0; border-radius: 7px; padding: 5px 11px; cursor: pointer; }
  .seg button.on { background: var(--raised); color: var(--text); }
  .meta { color: var(--faint); font-size: 12px; margin-left: auto; }
  .wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 50px); }
  nav { border-right: 1px solid var(--line); padding: 12px; overflow: auto; max-height: calc(100vh - 50px); position: sticky; top: 50px; }
  nav h3 { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin: 8px 4px; }
  .path { display: block; width: 100%; text-align: left; padding: 7px 9px; border-radius: 8px; color: var(--soft); }
  .path.on { background: var(--raised); color: var(--text); }
  .path .st { font-size: 11px; }
  .steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .step { display: grid; grid-template-columns: 96px 1fr; gap: 8px; align-items: start; text-align: left; padding: 5px; border-radius: 8px; border: 1px solid transparent; color: var(--soft); font-size: 12px; line-height: 1.35; }
  .step img { width: 96px; border-radius: 4px; border: 1px solid var(--line); display: block; }
  .step.on { border-color: var(--accent); background: var(--panel); color: var(--text); }
  .step .nm { display: block; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .aside { font-size: 12px; color: var(--faint); padding: 2px 6px 2px 10px; border-left: 2px solid var(--line); }
  main { padding: 14px 18px 60px; min-width: 0; }
  .title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .title h2 { margin: 0; font-size: 19px; }
  .note { color: var(--dim); margin: 4px 0 10px; }
  .stage { background: var(--deep); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; }
  .stage img { width: 100%; display: block; }
  .stage iframe { border: 0; display: block; transform-origin: 0 0; background: #0D0B17; }
  .hint { color: var(--faint); font-size: 12px; margin-top: 6px; }
  .hint:empty { display: none; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } }
  .marks { position: absolute; inset: 0; }
  .marks.live { right: auto; bottom: auto; pointer-events: none; }
  .mk { position: absolute; border-radius: 3px; }
  .mk.bad { outline: 2px solid var(--bad); } .mk.warn { outline: 2px dashed var(--warn); }
  .mk.hl { outline: 2px solid var(--accent); background: rgba(255, 210, 63, .18); }
  .side { position: sticky; top: 64px; max-height: calc(100vh - 80px); display: flex; flex-direction: column; min-height: 0; }
  .sum { font-size: 13px; color: var(--soft); padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
  .list { overflow: auto; min-height: 0; }
  .it { padding: 8px 6px; border-bottom: 1px solid var(--line); border-radius: 6px; cursor: default; }
  .it.hl { background: var(--raised); }
  .sub { font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--faint); margin: 14px 6px 2px; }
  .it .w { font-size: 13px; color: var(--text); overflow-wrap: anywhere; }
  .it.other .w { color: var(--dim); }
  .it .k { font: 11px ui-monospace, Menlo, monospace; color: var(--faint); overflow-wrap: anywhere; margin-top: 1px; }
  .it .f, .it .f2 { font-size: 12px; margin-top: 2px; } .it .f2 { color: var(--faint); }
  .ok { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); font-weight: 600; }
  .dim, .faint { color: var(--faint); } .chip { font-size: 11px; background: #1A1628; border-radius: 6px; padding: 1px 6px; color: var(--soft); }
  .edits { margin-top: 10px; padding: 8px; border: 1px solid var(--accent); border-radius: 8px; font-size: 12px; }
  .edits pre { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--soft); margin: 6px 0; max-height: 160px; overflow: auto; }
  .edits button { border: 1px solid var(--line2); padding: 2px 8px; font-size: 12px; }
  .keys { columns: 2 420px; column-gap: 24px; }
  .keyrow { break-inside: avoid; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .keyrow code { color: var(--dim); font-size: 12px; } .keyrow .words { display: block; margin: 2px 0 6px; }
  .keyrow .uses { display: flex; gap: 6px; flex-wrap: wrap; }
  .keyrow .uses button { padding: 0; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .keyrow .uses img { width: 92px; display: block; }
  .err { color: var(--bad); white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>Screen catalog</h1>
  <div class="seg" id="view"><button data-v="shot" class="on" title="Exactly what WebKit (the Mac window's engine) drew">Screenshot</button><button data-v="live" title="The same screen as HTML: click its words and type to see others in place">Live HTML</button><button data-v="keys" title="Every strings.js key the run reached, with the steps it shows on">Keys</button></div>
  <div class="seg" id="size"></div>
  <label class="faint" style="font-size:12px" title="Names, numbers, the scan's own words: text the app doesn't get from strings.js"><input type="checkbox" id="others"> also other text</label>
  <span class="meta" id="meta"></span>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<script src="data.js"></script>
<script src="measure.js"></script>
<script>
const C = window.CATALOG, $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let P = C.paths[0], S = null, VIEW = "shot", SIZE = C.sizes[0];
const steps = (p) => p.steps.filter((s) => !s.aside);
const EDITS = {};  // key -> words typed on the live screen (this page only; "Your edits" copies them for a drafts file)
let LIVEFIT = null;  // the live HTML's text, measured again after an edit (until then, as captured)

// ---- loading a captured page (a script per capture: works from disk)
const SNAPS = {};
window.CATALOG_SNAP = (id, html) => { SNAPS[id] = html; };
function loadSnap(file) {
  const id = file.replace(/\.snap\.js$/, "");
  if (SNAPS[id]) return Promise.resolve(SNAPS[id]);
  return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = file; s.onload = () => ok(SNAPS[id]); s.onerror = fail; document.head.append(s); });
}

// ---- the left: paths, then the chosen path's steps
function drawNav() {
  let h = `<h3>Paths</h3>` + C.paths.map((p, i) => `<button class="path ${p === P ? "on" : ""}" data-p="${i}">${esc(p.title)}<br><span class="st ${p.ok ? "ok" : "bad"}">${p.ok ? "passed" : "failed"}</span> <span class="st faint">${steps(p).length} steps</span></button>`).join("");
  h += `<h3 style="margin-top:16px">Steps</h3><div class="steps">`;
  for (const s of P.steps) {
    if (s.aside) { h += `<div class="aside">${esc(s.label)}</div>`; continue; }
    h += `<button class="step ${s === S ? "on" : ""}" data-n="${s.n}"><img src="${esc(s.sizes[C.sizes[0]].png)}" alt="" loading="lazy"><span>${s.n}. ${esc(s.label)}${s.name ? `<span class="nm">${esc(s.name)}</span>` : ""}</span></button>`;
  }
  if (!P.ok) h += `<div class="aside err">${esc(P.error)}</div>` + (P.failed_png ? `<img src="${esc(P.failed_png)}" style="width:100%;margin-top:6px;border-radius:6px">` : "");
  $("nav").innerHTML = h + `</div>`;
  for (const b of document.querySelectorAll(".path")) b.onclick = () => { P = C.paths[+b.dataset.p]; S = steps(P)[0] || null; draw(); };
  for (const b of document.querySelectorAll(".step")) b.onclick = () => { S = steps(P).find((x) => x.n === +b.dataset.n); draw(); };
  document.querySelector(".step.on")?.scrollIntoView({ block: "nearest" });
}

// ---- the step: its screen on the left, the text on it on the right
async function drawMain() {
  if (VIEW === "keys") return drawKeys();
  if (!S) { $("main").innerHTML = `<p class="faint">No steps captured.</p>`; return; }
  const z = S.sizes[SIZE], [w, h] = SIZE.split("x").map(Number);
  $("main").innerHTML = `<div class="title"><h2>${S.n}. ${esc(S.label)}</h2>${S.name ? `<span class="chip">${esc(S.name)}</span>` : ""}</div>`
    + (S.note ? `<p class="note">${esc(S.note)}</p>` : `<p class="note faint">${esc(P.title)}</p>`)
    + `<div class="cols"><div><div class="stage" id="stage"></div><p class="hint" id="hint"></p></div>`
    + `<div class="side"><div class="sum" id="sum"></div><div class="list" id="list"></div><div id="edits"></div></div></div>`;
  LIVEFIT = null;
  const stage = $("stage");
  if (VIEW === "shot") {
    stage.innerHTML = `<img src="${esc(z.png)}" alt=""><div class="marks" id="marks"></div>`;
  } else {
    const fr = document.createElement("iframe"), k = Math.min(1, (stage.clientWidth || 1000) / w);
    fr.style.width = w + "px"; fr.style.height = h + "px"; fr.style.transform = `scale(${k})`;
    stage.style.height = Math.round(h * k) + "px";
    stage.append(fr);
    stage.insertAdjacentHTML("beforeend", `<div class="marks live" id="marks" style="width:${w * k}px;height:${h * k}px"></div>`);
    $("hint").textContent = "Click any outlined words on the screen and type: the list measures them again when you click away. "
      + "Drawn by this browser, not WebKit, so a line may break a word sooner or later than in the app.";
    const html = await loadSnap(z.snap);
    await new Promise((r) => { fr.onload = r; fr.srcdoc = html.replaceAll("__WEB__", "web"); });
    for (const w of frames(fr.contentWindow))  // scroll positions as captured
      for (const el of w.document.querySelectorAll("[data-scroll]")) { const [t, l] = el.dataset.scroll.split(",").map(Number); el.scrollTop = t; el.scrollLeft = l; }
    editable(fr.contentWindow);
    if (fill(Object.keys(EDITS))) remeasure();  // unedited, the list stays as WebKit measured it
  }
  drawList();
}
function frames(win) {  // a captured page and the frames inside it
  const out = [win];
  for (const f of win.document.querySelectorAll("iframe")) try { out.push(...frames(f.contentWindow)); } catch (e) { /* */ }
  return out;
}
const liveWin = () => $("stage")?.querySelector("iframe")?.contentWindow;
function marked(win) {  // the keys the capture marked, for measure.js (words as they read now: edits included)
  for (const w of frames(win)) {
    const k = new Map();
    for (const el of w.document.querySelectorAll("[data-k]")) k.set(el.textContent.replace(/\s+/g, " ").trim(), el.dataset.k);
    for (const el of w.document.querySelectorAll("[data-tip-k]")) k.set(el.title.trim(), el.dataset.tipK);
    w.__tKeyOf = (text) => k.get(text) ?? null;
  }
}
function editable(win) {  // the live page: every strings.js string can be clicked and typed into
  for (const w of frames(win)) {
    const st = w.document.createElement("style");
    st.textContent = `[data-k]:not([data-k*=" + "]) { cursor: text; } [data-k]:not([data-k*=" + "]):hover { outline: 1px dashed #FFD23F; outline-offset: 1px; }
      [data-k]:focus { outline: 2px solid #FFD23F !important; outline-offset: 1px; }`;
    w.document.head.append(st);
    for (const el of w.document.querySelectorAll("[data-k]")) {
      if (el.dataset.k.includes(" + ")) continue;
      el.contentEditable = "plaintext-only";
      el.spellcheck = false;
      el.addEventListener("click", (e) => e.preventDefault());
      el.addEventListener("focus", () => hl(ID({ kind: "text", key: el.dataset.k }), true));
      el.addEventListener("input", () => { EDITS[el.dataset.k] = el.textContent; fill([el.dataset.k], el); drawEdits(); });
      el.addEventListener("blur", () => remeasure());
    }
  }
}
function fill(keys, except = null) {  // the edits to these keys, into the live screen (not where values were filled
  // into the words: those were edited as shown); how many places changed
  const win = liveWin();
  let n = 0;
  if (!win || except?.hasAttribute("data-filled")) return 0;
  for (const w of frames(win)) for (const el of w.document.querySelectorAll("[data-k]"))
    if (el !== except && keys.includes(el.dataset.k) && !el.hasAttribute("data-filled")) { el.textContent = EDITS[el.dataset.k]; n++; }
  return n;
}
let timer = 0;
function remeasure() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const win = liveWin();
    if (!win) return;
    marked(win);
    LIVEFIT = window.CATALOG_MEASURE(win);
    drawList();
  }, 200);
}

// how a piece of text fits, in words: [class, words]
function fitInfo(x) {
  if (!x) return ["dim", "not on this screen"];
  if (x.kind === "tooltip") return ["dim", "a tooltip: shows on hover"];
  if (x.cut) return ["bad", "cut off: its end isn't shown"];
  if (x.edge) return ["dim", "in a strip that scrolls sideways"];
  const lines = x.lines > 1 ? `${x.lines} lines` : "one line";
  const room = x.room == null ? "" : x.room >= 256 ? ", plenty of room" : `, room for ~${x.room} more characters`;
  if (x.fold) return ["warn", `below the fold: scroll to see it (${lines})`];
  if (x.room != null && x.room < 4) return ["warn", `${lines}, only ~${x.room} more characters fit`];
  return ["ok", lines + room];
}
const ID = (x) => `${x.kind}|${x.key || "text:" + x.text}`;
const RANK = { bad: 3, warn: 2, dim: 1, ok: 0 };
function group(list) {  // one entry per string, its places on the screen, its worst fit
  const g = new Map();
  for (const x of list || []) {
    const id = ID(x);
    if (!g.has(id)) g.set(id, { id, x, all: [], worst: x });
    const r = g.get(id);
    r.all.push(x);
    if (RANK[fitInfo(x)[0]] > RANK[fitInfo(r.worst)[0]]) r.worst = x;
    if (x.text.length > r.x.text.length) r.x = x;
  }
  return g;
}
function drawList() {
  const live = VIEW === "live", [w, h] = SIZE.split("x").map(Number);
  const main = live && LIVEFIT ? LIVEFIT : S.sizes[SIZE].text, otherSize = C.sizes.find((zz) => zz !== SIZE);
  const g = group(main), go = group(S.sizes[otherSize]?.text);
  const rs = [...g.values()].filter((r) => r.x.key || $("others").checked)
    .sort((a, b) => (a.x.kind === "tooltip") - (b.x.kind === "tooltip"));  // what's on screen first, in reading order; then the tooltips
  const count = { bad: 0, warn: 0 };
  let html = "";
  for (const r of rs) {
    const [cls, words] = fitInfo(r.worst), o = go.get(r.id), [ocls, owords] = o ? fitInfo(o.worst) : ["dim", "not on screen"];
    if (cls in count) count[cls]++;
    if (r.x.kind === "tooltip" && !html.includes('class="sub"')) html += `<div class="sub">Tooltips</div>`;
    const edited = r.x.key in EDITS;
    html += `<div class="it ${r.x.key ? "" : "other"}" data-id="${esc(r.id)}">`
      + `<div class="w">${esc(r.x.text)}${edited ? ` <span class="chip">edited</span>` : ""}</div>`
      + `<div class="k">${r.x.key ? esc(r.x.key) : "not from strings.js"}${r.all.length > 1 ? ` · shown ${r.all.length}×` : ""}</div>`
      + (r.x.kind === "tooltip" ? "" : `<div class="f ${cls}">${esc(words)}</div>`)
      + (owords !== words && !live ? `<div class="f2">at ${otherSize.replace("x", " × ")}: <span class="${ocls}">${esc(owords)}</span></div>` : "")
      + `</div>`;
  }
  $("sum").innerHTML = `<b>${rs.length}</b> ${rs.length === 1 ? "string" : "strings"} at ${SIZE.replace("x", " × ")}`
    + (count.bad ? ` · <span class="bad">${count.bad} cut off</span>` : "") + (count.warn ? ` · <span class="warn">${count.warn} to check</span>` : "")
    + (!count.bad && !count.warn ? ` · <span class="ok">all fit</span>` : "");
  $("list").innerHTML = html || `<p class="dim">No text from strings.js on this screen.</p>`;
  // the screen: problems outlined; every string findable by hovering
  let marks = "";
  for (const r of rs) {
    const [cls] = fitInfo(r.worst);
    for (const x of r.all) {
      if (!x.box || x.kind !== "text") continue;
      const [l, t, bw, bh] = x.box;
      marks += `<div class="mk ${cls === "bad" || cls === "warn" ? cls : ""}" data-id="${esc(r.id)}" title="${esc(r.x.key || "not from strings.js")}" `
        + `style="left:${(l / w) * 100}%;top:${(t / h) * 100}%;width:${(bw / w) * 100}%;height:${(bh / h) * 100}%"></div>`;
    }
  }
  $("marks").innerHTML = marks;
  for (const el of document.querySelectorAll(".it, .mk")) {
    el.onmouseenter = () => hl(el.dataset.id, el.classList.contains("mk"));
    el.onmouseleave = () => hl(null);
  }
  drawEdits();
}
function hl(id, scroll = false) {  // a string, lit up in the list and on the screen
  for (const el of document.querySelectorAll(".it, .mk")) el.classList.toggle("hl", el.dataset.id === id);
  if (id && scroll) document.querySelector(`.it[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: "nearest" });
}
function drawEdits() {  // what's been typed, ready to keep (a drafts file for run.py --drafts)
  const ks = Object.keys(EDITS);
  if (!$("edits")) return;
  $("edits").innerHTML = !ks.length ? "" : `<div class="edits"><b>Your edits</b> <button id="copy">Copy</button> <button id="undo">Undo all</button>`
    + `<pre>${esc(JSON.stringify({ strings: EDITS }, null, 1))}</pre><p class="dim">Paste into a drafts file and run <code>run.py --drafts that-file</code> to see them in WebKit. `
    + `Words with numbers or names filled in were edited as shown: put their {placeholders} back.</p></div>`;
  if ($("copy")) $("copy").onclick = () => navigator.clipboard?.writeText(JSON.stringify({ strings: EDITS }, null, 1));
  if ($("undo")) $("undo").onclick = () => { for (const k of ks) delete EDITS[k]; drawMain(); };
}

// ---- keys: every strings.js key the run reached, and where
function drawKeys() {
  const uses = new Map();
  for (const p of C.paths) for (const s of steps(p)) for (const x of s.sizes[C.sizes[0]].text) {
    if (!x.key) continue;
    for (const k of x.key.split(" + ")) {
      if (!uses.has(k)) uses.set(k, { words: x.key === k ? x.text : null, at: [] });
      const u = uses.get(k);
      if (!u.words && x.key === k) u.words = x.text;
      if (!u.at.some((a) => a[0] === p && a[1] === s)) u.at.push([p, s]);
    }
  }
  const ks = [...uses.keys()].sort();
  $("main").innerHTML = `<div class="title"><h2>Keys</h2><span class="faint">${ks.length} strings.js keys on these screens, each with the steps it shows on</span></div>`
    + `<div class="keys">` + ks.map((k) => { const u = uses.get(k); return `<div class="keyrow"><code>${esc(k)}</code><span class="words">${esc(u.words ?? "")}</span><div class="uses">`
      + u.at.map(([p, s]) => `<button data-p="${C.paths.indexOf(p)}" data-n="${s.n}" title="${esc(p.title)} · ${s.n}. ${esc(s.label)}"><img src="${esc(s.sizes[C.sizes[0]].png)}" alt="" loading="lazy"></button>`).join("") + `</div></div>`; }).join("") + `</div>`;
  for (const b of document.querySelectorAll(".uses button")) b.onclick = () => { P = C.paths[+b.dataset.p]; S = steps(P).find((x) => x.n === +b.dataset.n); VIEW = "shot"; setSeg("view", "shot"); draw(); };
}

function setSeg(id, v) { for (const b of $(id).querySelectorAll("button")) b.classList.toggle("on", b.dataset.v === v); }
function draw() { drawNav(); drawMain(); }
$("size").innerHTML = C.sizes.map((zz, i) => `<button data-v="${zz}" class="${i ? "" : "on"}">${zz.replace("x", " × ")}</button>`).join("");
for (const [id, set] of [["view", (v) => { VIEW = v; }], ["size", (v) => { SIZE = v; }]])
  for (const b of $(id).querySelectorAll("button")) b.onclick = () => { setSeg(id, b.dataset.v); set(b.dataset.v); drawMain(); };
$("others").onchange = () => VIEW !== "keys" && S && drawList();
document.addEventListener("keydown", (e) => {
  if (document.activeElement?.tagName === "INPUT" || !S) return;
  const ss = steps(P), i = ss.indexOf(S);
  if (e.key === "ArrowRight" && i < ss.length - 1) { S = ss[i + 1]; draw(); e.preventDefault(); }
  if (e.key === "ArrowLeft" && i > 0) { S = ss[i - 1]; draw(); e.preventDefault(); }
});
$("meta").textContent = `${C.when} · ${C.wording} wording · ${C.paths.filter((p) => p.ok).length}/${C.paths.length} paths passed`;
