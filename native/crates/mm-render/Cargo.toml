[package]
name = "mm-render"
description = "wgpu: the device (own or adopted from Qt), the WGSL compositor, YUV->RGB, prep, readback."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mm-render-ref"
path = "src/bin/mm_render_ref.rs"

[dependencies]
mm-core.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
half.workspace = true
anyhow.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
# the corner mark: the wordmark font's outlines hinted as FreeType does (its autohinter), from the tables CoreText decoded
skrifa = "0.44"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-metal.workspace = true
objc2-foundation = { workspace = true, features = ["NSAttributedString", "NSDictionary", "NSString", "NSGeometry"] }
objc2-core-foundation.workspace = true
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"

objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSStringDrawing", "NSGraphicsContext", "NSFont", "objc2-core-graphics", "objc2-core-foundation"] }
