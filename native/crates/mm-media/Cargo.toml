[package]
name = "mm-media"
description = "GStreamer: probe, Decoder (seek/next with source pts), Exporter (encode, mux, audio copied); per-OS frame import into wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
mm-core.workspace = true
mm-vision.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true
wgpu.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
mm-render = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-metal.workspace = true
objc2-image-io = "0.3"
objc2-core-graphics = "0.3"
# the depth cache's grey movie (grey.rs): AVAssetWriter, as video_io.writer
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "objc2-core-foundation", "block2"] }
objc2-core-media = "0.3"
block2 = "0.6"

[[bin]]
name = "mm-media-parity"
path = "src/bin/mm-media-parity.rs"

# the GPU display conversion (mm-render's yuv pass on our planes) for media_decode.py --gpu
[[bin]]
name = "mm-media-gpu"
path = "src/bin/mm-media-gpu.rs"
required-features = ["gpu-parity"]

[features]
gpu-parity = ["dep:mm-render"]

[dev-dependencies]
objc2-core-video.workspace = true
