<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-brand="name"></title>
<link rel="stylesheet" href="/theme.css">
<script src="/brand.js"></script>
<style>
  /* Licences: what the app is built from (THIRD_PARTY_NOTICES.md, drawn from its Markdown) and its own licence
     (LICENSE, as plain text). Opened from the line under the projects on the start page and from Help > Licences.
     Its bar is app.html's: in the Mac app it is the window's title bar (body.native), so Back must sit in it, not
     under it (a button under the transparent title bar can't be clicked). Back, Esc and Cmd-[ return to the start. */
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text);
         font: 14px/1.55 var(--body); }
  .titlebar { flex: none; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
              background: var(--bar); border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
  body.native .titlebar { padding-left: 86px; }
  .crumb { font-size: 13px; color: var(--dim); }
  .titlebar .fill { flex: 1; align-self: stretch; }
  .scroll { flex: 1; overflow: auto; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 17px; margin: 32px 0 10px; }
  p { color: var(--soft); margin: 0 0 10px; }
  code { font: 12px/1.4 ui-monospace, Menlo, monospace; background: var(--chip); border-radius: 4px; padding: 1px 4px; }
  .table { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--dim); font-weight: 600; background: var(--panel); }
  td { color: var(--soft); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; padding: 14px; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--soft); margin: 0; }
</style>
</head>
<body>
<header class="titlebar pywebview-drag-region">
  <span class="wordmark pywebview-drag-region" data-brand="wordmark"></span>
  <span class="crumb pywebview-drag-region" data-i18n="legal.title"></span>
  <span class="fill pywebview-drag-region"></span>
  <button id="back"><span data-i18n="legal.back"></span></button>
</header>
<div class="scroll">
<main>
  <div id="notices"></div>
  <h2 data-i18n="legal.license"></h2>
  <pre id="license"></pre>
</main>
</div>
<script src="/strings.js"></script>
<script>
i18n();
const back = () => { location.href = "/"; };
document.getElementById("back").onclick = back;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" || (e.metaKey && e.key === "[")) { e.preventDefault(); back(); }
});
// The Mac app (desktop.py) calls this from its menu bar; Licences is this page, the rest have nothing to act on here.
window.menuCommand = (cmd) => { if (cmd === "open") back(); };
const native = () => document.body.classList.add("native");
if (window.pywebview) native(); else window.addEventListener("pywebviewready", native);

// The notices file's Markdown: headings, paragraphs, tables, `code`, *italics*, **bold**. Nothing else is in it.
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
const cells = (row) => row.trim().replace(/^\||\|$/g, "").split("|").map((c) => inline(c.trim()));
function markdown(src) {
  const out = [], lines = src.split("\n");
  for (let i = 0; i < lines.length;) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (l.startsWith("|")) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith("|")) rows.push(lines[i++]);
      const body = rows.slice(2).map((r) => "<tr>" + cells(r).map((c) => `<td>${c}</td>`).join("") + "</tr>");
      out.push(`<div class="table"><table><thead><tr>${cells(rows[0]).map((c) => `<th>${c}</th>`).join("")}</tr></thead>` +
               `<tbody>${body.join("")}</tbody></table></div>`);
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#|\|)/.test(lines[i])) para.push(lines[i++].trim());
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}
fetch("/THIRD_PARTY_NOTICES.md").then((r) => r.ok ? r.text() : "").then((s) => {
  document.getElementById("notices").innerHTML = markdown(s);
});
fetch("/LICENSE").then((r) => r.ok ? r.text() : "").then((s) => { document.getElementById("license").textContent = s; });
</script>
</body>
</html>
