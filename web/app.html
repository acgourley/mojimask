<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-brand="name"></title>
<link rel="stylesheet" href="/theme.css">
<script src="/brand.js"></script>
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  /* ---- the bar: the wordmark, where you are, and the project's steps. In the Mac app it is the window's own title
     bar (the traffic lights sit in its left end: body.native), and dragging it moves the window. */
  .titlebar { flex: none; height: 52px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; padding: 0 16px;
              background: var(--bar); border-bottom: 1px solid var(--line); user-select: none; -webkit-user-select: none; }
  body.native .titlebar { padding-left: 86px; }
  .tb-left { display: flex; align-items: center; gap: 14px; min-width: 0; align-self: stretch; }
  .crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); min-width: 0; padding-left: 8px; }
  .crumb .go { cursor: pointer; border-radius: 4px; } .crumb .go:hover { color: var(--text); }
  .crumb .ic { color: var(--faint); width: 14px; height: 14px; }
  .crumb b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  main { flex: 1; min-height: 0; overflow: auto; }
  main > section { padding: 28px 32px 40px; }
  main > section.framed { padding: 0; height: 100%; }
  #editor, #decframe, #peopleframe { width: 100%; height: 100%; border: 0; background: var(--bg); display: block; }
  .statusbar { flex: none; height: 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 0 16px; background: var(--deep);
               border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
  .statusbar .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 8px; }
  .statusbar .stale { color: var(--warn); font-weight: 600; display: flex; align-items: center; gap: 6px; } .statusbar .stale .ic { width: 13px; height: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  /* ---- home */
  #s-start { display: flex; flex-direction: column; gap: 24px; max-width: 1400px; margin: 0 auto; }
  .drop { display: flex; justify-content: space-between; align-items: center; gap: 32px; padding: 36px 48px 36px 40px; border-radius: 20px;
          border: 1.5px solid var(--line3); background: linear-gradient(200deg, #2A2048 0%, #17132A 50%, #15121F 100%); transition: border-color .15s; }
  .drop.over { border-color: var(--accent); }
  .drop h2 { font-size: 34px; line-height: 1.1; margin: 0 0 14px; }
  .drop .sub { font-size: 16px; color: var(--soft); margin: 0 0 24px; }
  .drop .hint { font-size: 13px; color: var(--faint); margin: 16px 0 0; }
  .gallery { display: flex; align-items: center; gap: 16px; flex: none; }
  @media (max-width: 980px) { .gallery { display: none; } }
  .framed-art { padding: 7px; background: linear-gradient(135deg, #8A6238, #4A311A 33%, #3A2512 67%, #6E4C2A); box-shadow: 0 10px 20px #000000AA; }
  .framed-art > div { padding: 1px; background: #1A1008; } .framed-art > div > div { padding: 2px; background: linear-gradient(315deg, #F6E2A8, #C9A565 50%, #8C6B36); }
  .art { position: relative; overflow: hidden; width: 96px; height: 130px; display: block; background: #1A1008 center / cover; }
  .art.lg { width: 123px; height: 164px; }
  /* the emoji is the Mac's own, drawn as text, toned a little towards the painting */
  .art span { position: absolute; line-height: 1; transform-origin: top left; filter: saturate(.8) sepia(.18) brightness(.95) drop-shadow(0 1px 2px #1A0E0580); }
  .phead { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .phead h2 { display: flex; align-items: center; gap: 10px; }
  .countchip { font: 600 12px/1.3 var(--body); color: var(--soft); background: var(--raised); border-radius: 10px; padding: 2px 9px; }
  .storage { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--dim); }
  .folderchip { display: inline-flex; align-items: center; gap: 7px; font: 12px/1.3 var(--body); color: var(--dim); background: var(--panel); border: 1px solid var(--line);
                border-radius: 8px; padding: 5px 10px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.folderchip:hover { color: var(--text); }
  .phint { font-size: 13px; color: var(--faint); margin: 8px 0 0; }
  .pmsg { font-size: 13px; color: var(--soft); margin: 10px 0 0; }
  .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  @media (max-width: 900px) { .pgrid { grid-template-columns: 1fr; } }
  .proj { display: flex; align-items: center; gap: 14px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; position: relative; }
  .proj:hover { border-color: var(--line3); }
  .proj .thumb { width: 96px; height: 68px; border-radius: 8px; flex: none; background: var(--chip) center / cover; border: 1px solid var(--line); display: grid; place-content: center; color: var(--faint); }
  .proj .thumb.has { border: 0; }
  .proj .info { flex: 1; min-width: 0; display: grid; gap: 4px; }
  .proj .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .meta { font-size: 12px; color: var(--dim); } .proj .sizes { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .sizes.missing { color: var(--warn); }
  .proj .acts { display: flex; align-items: center; gap: 6px; flex: none; }
  .proj .acts .raised { padding: 8px 16px; }
  .menu { position: absolute; right: 12px; top: 60px; z-index: 20; width: 236px; padding: 6px; display: grid; gap: 2px; background: var(--menu); border: 1px solid var(--line3);
          border-radius: 12px; box-shadow: 0 12px 32px #000000B3; }
  .menu button { border: 0; border-radius: 8px; padding: 8px 10px; gap: 10px; color: var(--text); font-weight: 400; width: 100%; }
  .menu button:hover { background: var(--raised2); } .menu button .ic { width: 15px; height: 15px; color: var(--dim); }
  .menu button .tag { margin-left: auto; font: 600 11px/1.3 var(--body); letter-spacing: .5px; color: var(--faint); }
  .menu button.danger, .menu button.danger .ic { color: var(--bad); }
  .menu hr { border: 0; border-top: 1px solid var(--line3); margin: 3px 0; width: 100%; }

  /* ---- scan */
  #s-scan { height: 100%; display: flex; align-items: center; }
  .scan { display: flex; align-items: center; gap: 32px; width: 100%; max-width: 1400px; margin: 0 auto; }
  .scan .left { flex: 1 1 62%; min-width: 0; display: flex; justify-content: center; }
  /* the picture at the video's own shape (--ar, set when its size is known), the timeline as wide as it */
  .stagecol { --ar: 1.6; width: min(100%, calc(min(68vh, 760px) * var(--ar))); display: grid; gap: 14px; }
  .scan .right { flex: 1 1 38%; min-width: 300px; max-width: 460px; display: grid; gap: 20px; }
  @media (max-width: 860px) { #s-scan { height: auto; } .scan { flex-direction: column; align-items: stretch; } .scan .right { max-width: none; } }
  .stagebox { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: var(--ar); display: grid; place-items: center; }
  .stagebox img.preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; }  /* whole, never cropped */
  .previewph { display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; text-align: center; padding: 0 28px; }
  .badge { position: absolute; left: 14px; top: 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; background: #07060DCC; border-radius: 8px; padding: 5px 10px; }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: livedot 1.4s ease-in-out infinite; }
  @keyframes livedot { 50% { opacity: .35; } }
  .tline { height: 6px; border-radius: 3px; background: var(--raised); overflow: hidden; } .tline i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .6s linear; }
  .tlabels { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
  .scan .headline { font: 800 34px/1.1 var(--display); margin: -8px 0 0; }
  .pct { display: flex; align-items: flex-end; gap: 10px; } .pct b { font: 900 72px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .pct span { font-size: 14px; color: var(--dim); padding-bottom: 8px; }
  .segs { display: flex; gap: 4px; } .segs div { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .segs i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  .stepcap { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .stats { padding: 6px 16px; } .stat { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 14px; color: var(--dim); }
  .stat + .stat { border-top: 1px solid var(--line); } .stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .privacy { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); } .privacy .ic { width: 14px; height: 14px; }
  #scanerr { color: var(--warn); margin: 0; } #scanerr:empty { display: none; }
  .opening { height: 100%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
  /* "Deciding who's who": decide_viz.js */
  .dvbox { width: 100%; height: 100%; }
  .dv { position: relative; width: 100%; height: 100%; background: #000; overflow: hidden; color: #ececec; }
  .dv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .dv-cap { position: absolute; left: 14px; right: 14px; top: 10px; pointer-events: none; }
  .dv-title { font-size: 14px; font-weight: 600; } .dv-sub { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; min-height: 18px; }
  .dv-faces { position: absolute; left: 30px; right: 12px; bottom: 24px; height: 84px; display: flex; gap: 8px; overflow: hidden; align-items: flex-end; }
  .dv-card { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; }
  .dv-card img { width: 60px; height: 60px; border-radius: 8px; border: 2px solid #444; object-fit: cover; background: #111; display: block; }
  .dv-pair > div { display: flex; gap: 2px; }
  .dv-pair img { width: 48px; height: 48px; }
  .dv-card span { font-size: 10px; white-space: nowrap; color: var(--dim); }
  .dv-in { animation: dvin .35s ease-out; }
  @keyframes dvin { from { opacity: 0; transform: translateX(-16px) scale(.9); } }
  .dv-legend { position: absolute; right: 12px; bottom: 5px; font-size: 11px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  .dv-legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; }
  .dv-legend i.ring { border: 1px solid #80868f; }
  .dv-axis-x { position: absolute; left: 30px; bottom: 5px; font-size: 11px; color: var(--faint); }
  .dv-axis-y { position: absolute; left: 4px; top: 58px; bottom: 112px; writing-mode: vertical-rl; transform: rotate(180deg); font-size: 11px; color: var(--faint); text-align: center; }

  /* ---- the preview player (result, export): frames from the export's own renderer */
  .player img { width: 100%; max-height: 62vh; object-fit: contain; background: #000; border-radius: 14px; display: block; }
  .player .ctl { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .player .pp { width: 40px; height: 40px; padding: 0; justify-content: center; border-radius: 50%; background: var(--accent); border-color: var(--accent); color: var(--ink); flex: none; }
  .player input[type=range] { flex: 1; } .player .tl { font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

  /* ---- result */
  .rwrap { max-width: 800px; margin: 0 auto; } .rwrap .player img { max-height: 56vh; }
  .rhero { margin-top: 22px; text-align: center; }
  .rhero h2 { font-size: 34px; margin: 0 0 6px; } .rhero p { margin: 0 0 16px; color: var(--soft); font-size: 15px; }
  .rstyles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 0 0 18px; text-align: left; }
  .rstyles label, .style { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px;
                           cursor: pointer; background: var(--panel); }
  .rstyles label:hover, .style:hover { border-color: var(--line2); }
  .rstyles input { position: absolute; opacity: 0; pointer-events: none; }
  .rstyles .hint { grid-column: 1 / -1; font-size: 12px; color: var(--dim); line-height: 1.35; }
  .rstyles label.on, .style.on { border-color: var(--accent); background: var(--accent-tint); } .rstyles label.on b, .style.on b { color: var(--accent); }
  .rstyles label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rstyles .icon { font-size: 20px; text-align: center; }
  .rnext { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .rnext button { display: block; width: 100%; text-align: left; white-space: normal; padding: 14px 18px; }
  @media (max-width: 560px) { .rnext { grid-template-columns: 1fr; } }
  .rnext .sub { display: block; font-size: 13px; font-weight: 400; margin-top: 3px; color: var(--dim); }
  .rnext button.primary .sub { color: #1A1405B3; }
  /* the covering step before the result: the busiest frame, rings on its faces, then the covered frame fades in */
  .rcover { text-align: center; }
  .rstage { background: #000; border-radius: 14px; display: flex; justify-content: center; overflow: hidden; }
  .rframe { position: relative; height: 100%; max-width: 100%; }
  .rframe img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .rframe img.raw { filter: saturate(.75) brightness(.8); }
  .rframe img.done { opacity: 0; transition: opacity .9s ease; } .rcover.covered img.done { opacity: 1; }
  .rframe .ring { position: absolute; border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent);
                  animation: ringpulse 1.6s ease-in-out infinite; transition: opacity .5s; }
  .rcover.covered .ring { opacity: 0; }
  @keyframes ringpulse { 0%, 100% { transform: scale(.92); opacity: .55; } 50% { transform: scale(1.08); opacity: 1; } }
  .rcover h2 { font-size: 26px; margin: 20px 0 4px; }
  .rsteps { display: inline-grid; gap: 7px; margin: 10px auto 0; text-align: left; font-size: 14px; }
  .rsteps div { display: grid; grid-template-columns: 22px 1fr; align-items: center; color: var(--dim); transition: color .3s; }
  .rsteps div.on, .rsteps div.ok { color: var(--text); } .rsteps .mk { display: inline-flex; justify-content: center; }
  .rsteps div.ok .mk { color: var(--good); }
  .rhero.reveal { animation: rise .5s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .confetti { position: fixed; inset: 0; pointer-events: none; z-index: 900; }

  /* ---- export */
  .two { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 32px; max-width: 1400px; margin: 0 auto; align-items: start; }
  @media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
  .xside { display: grid; gap: 16px; }
  .xside h2 { font-size: 30px; }
  .styles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .style { display: block; } .style b { font-weight: 600; } .style .small { font-size: 12px; margin-top: 2px; }
  .trim { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--dim); } .trim input { width: 76px; margin: 0 4px; }
  .markrow { display: flex; gap: 10px; align-items: center; color: var(--soft); cursor: pointer; }
  .risk { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; } .risk b { font-weight: 600; }
  .note { border-left: 3px solid var(--warn); padding: 10px 14px; background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 0 10px 10px 0; font-size: 13px; color: var(--soft); }
  .note b { color: var(--text); font-weight: 600; }
  a.act { cursor: pointer; }
  .legal { font-size: 12px; color: var(--faint); margin: 28px 0 8px; }
  .legal a { color: var(--soft); }
</style>
</head>
<body>
<header class="titlebar pywebview-drag-region" id="bar">
  <div class="tb-left pywebview-drag-region"><span class="wordmark pywebview-drag-region" data-brand="wordmark"></span><span class="crumb pywebview-drag-region" id="crumb"></span></div>
  <nav id="nav" data-i18n-aria-label="nav.label" class="pywebview-drag-region"></nav>
  <div class="pywebview-drag-region" style="align-self:stretch"></div>
</header>
<main>
  <!-- 1. home: start a project, and the projects there are -->
  <section id="s-start">
    <div class="drop" id="drop">
      <div>
        <h2 data-i18n="start.drop_title"></h2>
        <p class="sub" data-i18n="start.drop_sub"></p>
        <div class="row">
          <input type="file" id="file" accept="video/*,image/*" class="hidden">
          <button class="primary big" id="pick"><i data-ic="upload" data-size="18"></i><span id="picklabel" data-i18n="start.choose"></span></button>
          <button class="big" id="sample"><i data-ic="play" data-size="18"></i><span data-i18n="start.sample"></span></button>
        </div>
      </div>
      <!-- three old paintings (public domain), their faces covered the way the app covers them -->
      <div class="gallery" aria-hidden="true">
        <div class="framed-art"><div><div><div class="art" style="background-image:url(/assets/gallery/mona.jpg)"><span style="left:24.2%;top:17.2%;font-size:38px;transform:rotate(-6deg)">😏</span></div></div></div></div>
        <div class="framed-art"><div><div><div class="art lg" style="background-image:url(/assets/gallery/cavalier.jpg)"><span style="left:21.3%;top:19.6%;font-size:41px;transform:rotate(-11deg)">🥸</span></div></div></div></div>
        <div class="framed-art"><div><div><div class="art" style="background-image:url(/assets/gallery/pearl.jpg)"><span style="left:20.6%;top:18.2%;font-size:49px;transform:rotate(11deg)">🐱</span></div></div></div></div>
      </div>
    </div>
    <div id="recent"></div>
    <p class="legal"><span data-i18n="legal.line"></span> <a href="licenses.html" data-i18n="legal.link"></a></p>
  </section>

  <!-- 2. scan -->
  <section id="s-scan" class="hidden">
    <!-- opening a project scanned before: nothing to show but a moment's wait (~1-2 s while its server starts) -->
    <div class="opening hidden" id="opening"><div class="spin"></div><h2 id="openingname" style="margin-top:8px"></h2><div class="dim small" data-i18n="scan.opening"></div></div>
    <div class="scan" id="scanview">
      <div class="left"><div class="stagecol" id="stagecol">
        <div class="stagebox">
          <div class="previewph" id="previewph"><div class="spin"></div><div class="dim small" id="previewnote" data-i18n="scan.getting_ready"></div></div>
          <img class="preview hidden" id="preview" data-i18n-alt="scan.preview_alt">
          <div class="dvbox hidden" id="dvbox"></div>
          <div class="badge hidden" id="scanbadge"><i></i><span class="num"></span></div>
        </div>
        <div class="tline" id="scantl"><i></i></div>
        <div class="tlabels num" id="scantlab"><span></span><span></span></div>
      </div></div>
      <div class="right">
        <div class="eyebrow" id="scanfile"></div>
        <div class="headline" id="scanhead" data-i18n="scan.getting_ready"></div>
        <div class="pct"><b id="scanpct">0%</b><span id="scanleft"></span></div>
        <div><div class="segs" id="steps"></div><div class="stepcap" id="stepcap"></div></div>
        <div class="card stats" id="stats"></div>
        <p class="small" id="scanerr"></p>
        <div class="privacy"><i data-ic="lock" data-size="14"></i><span data-i18n-html="scan.privacy_html"></span></div>
        <div><button class="big" id="cancelscan" data-i18n="scan.cancel"></button></div>
      </div>
    </div>
  </section>

  <!-- 3. result: the finished video first; refining is optional -->
  <section id="s-result" class="hidden">
    <div class="rwrap">
      <div class="rcover" id="rcover">
        <div class="rstage" id="rstage"><div class="rframe" id="rframe"><img class="raw" alt=""><img class="done" data-i18n-alt="result.done_alt"></div></div>
        <h2 id="rcoverhead" data-i18n="result.covering"></h2>
        <div class="rsteps" id="rsteps"></div>
      </div>
      <div class="player hidden" id="player-result"></div>
      <div class="rhero hidden" id="rhero">
        <h2 id="resulthead" data-i18n="result.head"></h2>
        <p id="resultsub" data-i18n="result.sub"></p>
        <div class="rstyles" id="rstyles" role="radiogroup" data-i18n-aria-label="result.styles_label"></div>
        <div class="rnext">
          <button class="primary big" id="r-export"><span data-i18n="result.export"></span><span class="sub" id="r-exportsub" data-i18n="result.export_sub_video"></span></button>
          <button class="big" id="r-refine"><span data-i18n="result.refine"></span><span class="sub" data-i18n="result.refine_sub"></span></button>
        </div>
      </div>
    </div>
  </section>

  <!-- decisions: the questions the scan left open (developer mode: every decision record) -->
  <section id="s-decisions" class="framed hidden">
    <iframe id="decframe" data-i18n-title="app.frame_decisions"></iframe>
  </section>

  <!-- people: everyone counted as a person; show, name, pick emoji -->
  <section id="s-people" class="framed hidden">
    <iframe id="peopleframe" data-i18n-title="app.frame_people"></iframe>
  </section>

  <!-- edit: the full editor (review.html in app mode), same engine and edits -->
  <section id="s-edit" class="framed hidden">
    <iframe id="editor" data-i18n-title="app.frame_editor"></iframe>
  </section>

  <!-- export -->
  <section id="s-export" class="hidden">
    <div class="two">
      <div class="player" id="player-export"></div>
      <div class="xside">
        <h2 data-i18n="export.title"></h2>
        <p class="small soft" id="styles" style="margin:-8px 0 0"></p>

<script>
i18n();  // the page's own text (strings.js)
const $ = (id) => document.getElementById(id);
// the engine's JSON reply; when there isn't one (no answer, a refusal, an error page): {error, failed: true}
const api = async (path, body) => {
  try {
    const r = await fetch(path, body !== undefined ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
    const j = await r.json().catch(() => null);
    if (r.ok && j) return j;
    return { error: (j && j.error) || t("app.err.engine_answered", { status: r.status }), failed: true };
  } catch (e) { return { error: t("app.err.engine_silent"), failed: true }; }
};
let PID = null, S = null, styleChoice = "emoji";
const SCREENS = ["start", "scan", "result", "decisions", "people", "edit", "export"];
let CUR = "start";
function show(name) {

  if (name === "export") { $("mark").checked = !!(EDITS && EDITS.watermark); VERSION++; drawStyles(); loadFormats(); }  // (drawStyles refreshes the preview once it knows the style)
}
// The bar: before a project is open, the steps ahead; with one open, its name and its four pages (the same on each).
// The tabs count what's waiting there: questions still open, people counted (the pages in frames report theirs too).
const COUNTS = { open: null, people: null };
async function refreshCounts() {
  const pid = PID, open = await openDecisions();
  if (PID !== pid || !S || !open) return;
  COUNTS.open = open.length; drawBar();
}
function drawBar() {
  const name = CUR, chev = Icon("chevron-right", 14);
  if (!S) {
    // no project open: no steps; while a scan runs, a way back to Projects (the scan carries on)
    $("crumb").innerHTML = name === "scan" ? `<span class="go" data-s="start" title="${t("nav.projects_tip_scanning")}">${t("nav.projects")}</span>` : "";
    $("nav").innerHTML = "";
  } else {
    $("crumb").innerHTML = `<span class="go" data-s="start" title="${t("nav.projects_tip_open")}">${t("nav.projects")}</span>${chev}<b title="${esc(S.name || "")}">${esc(S.name || "")}</b>`;
    const tab = (k, label, title, n) => `<button data-s="${k}" class="${name === k ? "on" : ""}" title="${title}">${label}${n != null ? `<span class="count">${n}</span>` : ""}</button>`;
    $("nav").innerHTML = `<div class="seg tabs">` +
      tab("decisions", t("nav.decisions"), t("nav.decisions_tip"), COUNTS.open) +
      tab("people", t("nav.people"), t("nav.people_tip"), COUNTS.people) +
      tab("edit", t("nav.edit"), t("nav.edit_tip")) +
      tab("export", t("nav.export"), t("nav.export_tip")) + `</div>`;
  }

}
async function go(name, piece = null) {

    if (S && PID) await api(P("/api/thumb"), { t: busiestFrame() }).catch(() => null);  // its picture, as its covers are now
    clearInterval(previewTimer); vizStop(); PID = null; S = null; FORMATS = null; EDITS = null; COUNTS.open = COUNTS.people = null;
    $("editor").removeAttribute("src"); $("decframe").removeAttribute("src"); $("peopleframe").removeAttribute("src");
    $("picklabel").textContent = t("start.choose"); $("tstart").value = ""; $("tend").value = ""; $("exportstatus").textContent = "";

  if (name === "decisions") showDecisions(piece);

  show(name);
}
// The decisions page inside the app; piece: only the decisions about one box (from the editor's R)
function showDecisions(piece) {
  const f = $("decframe"), url = P(`/decisions.html${S.dev ? "?dev=1" : ""}`), hash = piece != null ? `#piece=${encodeURIComponent(piece)}` : "";
  if (!f.src || !f.src.includes(url)) f.src = url + hash;
  else { f.contentWindow.location.hash = hash || "#"; f.contentWindow.reloadDecisions?.(); }
}

// ---------------- start
// In the Mac app, window.pywebview.api offers native Open / Save dialogs and Show in Finder.
let NATIVE = null;
window.addEventListener("pywebviewready", () => {
  NATIVE = window.pywebview.api;
  document.body.classList.add("native");  // the bar is the window's title bar: room for the traffic lights (theme: .titlebar)
  for (const el of document.querySelectorAll(".where")) el.textContent = t("app.where_mac");
  if (CUR === "start") loadRecent();
});
async function importPath(path) { importBody({ path }); }
async function importBody(body) { const r = await api("/api/import_path", body); if (r.id) startScan(r.id); else Dialog.tell(r.error || t("start.err.open_file")); }
$("pick").onclick = async () => {
  if (!NATIVE) return $("file").click();
  const path = await NATIVE.choose_video();
  if (path) importPath(path);
};
$("file").onchange = () => $("file").files[0] && upload($("file").files[0]);
$("sample").onclick = () => importBody({ sample: true });  // the bundled jazz clip, emoji gray like the footage (app_server.SAMPLE_EDITS)
const drop = $("drop");
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
// a file dropped anywhere else must not navigate the window away from the app
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); if (CUR === "start" && e.target !== drop && !drop.contains(e.target)) drop.ondrop(e); });
// In the Mac app the window hands dropped files to Python with their real path (desktop.py), which calls
// onNativeDrop(path): the video is used where it is. Without a path (a browser; onNativeDrop(null); or no answer from
// the window within NATIVE_WAIT_MS) it's copied. The window always answers (desktop.py: onNativeDrop(null) when it has
// no usable path), so the wait is only a safety net. Each drop is answered once: an answer after its copy has begun
// is ignored, so a slow window can't make a second project of the same video.
const NATIVE_WAIT_MS = 5000;
let pendingDrop = null;  // {file, timer}: a drop waiting for the window's answer
function onNativeDrop(path) {
  const d = pendingDrop; pendingDrop = null;
  if (!d) return;  // (no drop waiting: its copy has already begun)
  clearTimeout(d.timer);
  if (CUR !== "start") return;
  if (path) importPath(path); else upload(d.file);
}
drop.ondrop = (e) => {
  e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (!NATIVE) return upload(f);
  if (pendingDrop) clearTimeout(pendingDrop.timer);
  const d = pendingDrop = { file: f };
  d.timer = setTimeout(() => { if (pendingDrop === d) { pendingDrop = null; if (CUR === "start") upload(f); } }, NATIVE_WAIT_MS);
};
// No path available (a browser, or the Mac app's drop without one): the file is copied into a new project.
// While it copies, the two buttons are off and the first shows how far it is; if it fails, or nothing moves for
// STALL_S seconds, it stops and says so. (It used to say "Copying…" for ever: a name with a character a request
// header can't carry, such as "…", made the request throw before it was sent, and nothing caught it.)
const STALL_S = 30;
let COPYING = false;
function upload(file) {
  if (COPYING) return;
  COPYING = true;
  const busy = (on) => { COPYING = on; $("pick").disabled = $("sample").disabled = on; $("drop").setAttribute("aria-busy", on); if (!on) $("picklabel").textContent = t("start.choose"); };
  busy(true); $("picklabel").textContent = t("start.copying");
  const x = new XMLHttpRequest();
  let stall = null;
  const fail = (why) => { clearTimeout(stall); x.onload = x.onerror = x.onabort = null; x.abort(); busy(false); Dialog.tell(t("start.err.copy", { name: file.name, why })); };
  const alive = () => { clearTimeout(stall); stall = setTimeout(() => fail(t("start.err.copy_stalled", { s: STALL_S })), STALL_S * 1000); };
  x.upload.onprogress = (e) => { alive(); if (e.lengthComputable) $("picklabel").textContent = e.loaded < e.total ? t("start.copying_pct", { pct: Math.round(e.loaded / e.total * 100) }) : t("start.starting_scan"); };
  x.onerror = () => fail(t("start.err.engine_silent"));
  x.onload = () => {
    clearTimeout(stall);
    let r = null; try { r = JSON.parse(x.responseText); } catch (e) { /* not the engine's answer */ }
    if (x.status !== 200 || !r || !r.id) return fail((r && r.error) || t("start.err.engine_answered", { status: x.status }));
    busy(false); startScan(r.id);
  };

    x.open("POST", "/api/import");
    x.setRequestHeader("X-Filename", encodeURIComponent(file.name));  // (headers carry only plain characters)
    alive(); x.send(file);
  } catch (e) { fail(e.message || t("start.err.unreadable")); }
}
const fmtB = (b) => b >= 1e9 ? t("unit.gb", { n: (b / 1e9).toFixed(1) }) : b >= 1e6 ? t("unit.mb", { n: Math.round(b / 1e6) }) : t("unit.kb", { n: Math.max(1, Math.round(b / 1e3)) });
const esc = (x) => String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const OLD_DAYS = 30;
let CLEARED = "";  // the last "Clear cache" result, shown above the list
// Developer mode: what this server is running (depth on or off, since when), and a warning when the code on disk
// is newer than the server -- a running server keeps the code it started with.
function devBadge(app) {
  const b = $("devbar"), on = !!(app && app.dev);
  b.classList.toggle("hidden", !on);
  if (!on) return;
  const since = new Date(app.started * 1000).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
  b.innerHTML = `<span><span class="dot"></span>Dev · depth ${esc(app.depth)} · server since ${esc(since)}</span>` +
    (app.stale ? `<span class="stale">${Icon("triangle-alert", 13)}Code changed since: restart the server</span>` : "");
}
async function loadRecent() {
  const [ps, app] = await Promise.all([api("/api/projects"), api("/api/app")]);
  devBadge(app);
  if (!ps.length) { $("recent").innerHTML = ""; return; }
  const sum = (k) => ps.reduce((a, p) => a + p.sizes[k], 0);
  const now = Date.now() / 1000, stale = ps.filter((p) => now - p.last_used > OLD_DAYS * 86400 && p.sizes.cache > 0);

    p.last_used ? new Date(p.last_used * 1000).toLocaleDateString([], { month: "short", day: "numeric" }) : "", p.scanned ? "" : t("projects.scan_not_finished")].filter(Boolean).join(" · ");
  // a project's picture is a frame with its faces covered, saved when its first scan finishes (none before that)
  const card = (p) => `<div class="proj" data-id="${esc(p.id)}">
      <div class="thumb ${p.thumb ? "has" : ""}" ${p.thumb ? `style="background-image:url(/api/projects/${esc(p.id)}/thumb.jpg?v=${p.thumb})"` : ""}>${p.thumb ? "" : Icon("scan-face", 22)}</div>
      <div class="info"><div class="name" title="${esc(p.name)}">${esc(p.name)}</div><div class="meta">${meta(p)}</div>
        <div class="sizes ${p.video_found ? "" : "missing"}" title="${t("projects.sizes_tip")}${p.video_found ? "" : " " + t("projects.sizes_tip_missing", { path: esc(p.video) })}">${[t("projects.size_work", { size: fmtB(p.sizes.kept) }),
          t("projects.size_cache", { size: p.sizes.cache ? fmtB(p.sizes.cache) : t("projects.cache_cleared") }), p.sizes.copy ? t("projects.size_video", { size: fmtB(p.sizes.copy) }) : "",
          p.video_found ? "" : t("projects.video_not_found")].filter(Boolean).join(" · ")}</div></div>
      <div class="acts">${p.video_found ? `<button class="raised" data-act="open">${p.scanned ? t("projects.open") : t("projects.resume")}</button>` : `<button class="raised" data-act="locate">${t("projects.locate")}</button>`}
        <button class="icon" data-act="more" aria-label="${t("projects.more_for", { name: esc(p.name) })}" aria-haspopup="menu">${Icon("ellipsis", 18)}</button></div></div>`;
  $("recent").innerHTML = `<div class="phead"><h2>${t("projects.title")} <span class="countchip">${ps.length}</span></h2>
      <div class="storage"><span>${t("projects.on_disk", { size: fmtB(sum("kept") + sum("cache") + sum("copy")) })}</span>
        ${NATIVE ? `<button class="folderchip" id="showlib" title="${t("projects.show_folder_tip")}">${Icon("folder-open", 14)}${esc(tilde(app.projects_dir))}</button>`
                 : `<span class="folderchip" title="${esc(app.projects_dir)}">${Icon("folder-open", 14)}${esc(tilde(app.projects_dir))}</span>`}</div></div>
    <p class="phint">${t("projects.hint")}</p>
    ${CLEARED ? `<p class="pmsg">${CLEARED}</p>` : ""}
    ${stale.length ? `<p class="pmsg"><button class="small" id="clearstale">${t("projects.clear_stale", { n: stale.length, days: OLD_DAYS, size: fmtB(stale.reduce((a, p) => a + p.sizes.cache, 0)) })}</button></p>` : ""}
    <div class="pgrid">${ps.map(card).join("")}</div>`;
  if ($("showlib")) $("showlib").onclick = () => NATIVE.reveal(app.projects_dir);
  if ($("clearstale")) $("clearstale").onclick = async () => {
    for (const p of stale) await api(`/api/projects/${p.id}/clear_cache`, {});
    CLEARED = t("projects.freed_many", { n: stale.length, size: fmtB(stale.reduce((a, p) => a + p.sizes.cache, 0)) });
    loadRecent();
  };
  const act = async (p, name, b) => {
    const id = p.id;

    if (name === "locate") return locate(id, p.name);
    if (name === "reveal") return NATIVE.reveal(p.path);
    if (name === "clear") {
      await api(`/api/projects/${id}/clear_cache`, {});
      CLEARED = t("projects.freed_one", { size: fmtB(p.sizes.cache), name: esc(p.name) });
      return loadRecent();
    }

        ? t("projects.delete.copy", { size: fmtB(p.sizes.copy) })

    m.innerHTML = item("clear", "eraser", t("projects.menu.clear"), p.sizes.cache ? fmtB(p.sizes.cache) : "", p.sizes.cache ? `title="${t("projects.menu.clear_tip")}"` : "disabled") +
      (NATIVE ? item("reveal", "folder-open", t("common.show_in_finder")) : "") +
      (p.scanned && app.dev ? item("clone", "copy", "Clone fresh", "DEV", `title="Developer mode: a copy with the same scan but none of your answers, opening on the result screen like a new project"`) : "") +

// a project's ⋯ menu closes on a click outside it, or Esc (focus goes back to its button)
function closeMenu() { document.querySelector(".menu")?.remove(); document.querySelector('[data-act="more"][aria-expanded]')?.removeAttribute("aria-expanded"); }

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && document.querySelector(".menu")) { const b = document.querySelector('[data-act="more"][aria-expanded]'); closeMenu(); b?.focus(); } });
async function locate(id, name) {
  const path = NATIVE ? await NATIVE.locate_video(name) : await Dialog.input(t("projects.locate.ask", { name }), "", t("projects.locate.ok"));
  if (!path) return;

}

// ---------------- scan
const STEP_NAMES = { prepare: t("scan.step.prepare"), detect: t("scan.step.detect"), motion: t("scan.step.motion"), decide: t("scan.step.decide"), review: t("scan.step.review") };
// the same in the middle of a sentence ("next: following the camera")
const STEP_NEXT = { prepare: t("scan.step_next.prepare"), detect: t("scan.step_next.detect"), motion: t("scan.step_next.motion"), decide: t("scan.step_next.decide"), review: t("scan.step_next.review") };
const STEP_HEAD = { prepare: t("scan.head.prepare"), detect: t("scan.head.detect"), motion: t("scan.head.motion"), decide: t("scan.head.decide"), review: t("scan.head.review") };
let previewTimer = null;
// The live preview appears once the first frames are analysed; until then a spinner says what's happening.
$("preview").onload = () => { $("preview").classList.remove("hidden"); $("previewph").classList.add("hidden"); };
let OPENING = false;  // a project scanned before: a plain "Opening…" instead of the scan's progress
function startScan(id, opening = null) {
  PID = id; show("scan");
  OPENING = !!opening;
  $("opening").classList.toggle("hidden", !OPENING); $("scanview").classList.toggle("hidden", OPENING);
  if (OPENING) $("openingname").textContent = opening;
  $("preview").classList.add("hidden"); $("previewph").classList.remove("hidden"); $("previewnote").textContent = t("scan.getting_ready");
  $("preview").removeAttribute("src"); $("steps").innerHTML = ""; $("stats").innerHTML = ""; $("scanerr").textContent = "";
  $("scanhead").textContent = t("scan.getting_ready"); $("scanpct").textContent = "0%"; $("scanleft").textContent = $("stepcap").textContent = $("scanfile").textContent = "";
  $("scanbadge").classList.add("hidden"); $("scantl").firstElementChild.style.width = "0"; $("cancelscan").classList.remove("hidden");
  $("stagecol").style.removeProperty("--ar");  // (the last project's shape; this one's is set when its size is known)
  clearInterval(previewTimer); vizStop();

  pollScan();
}
// Cancel: the scan stops at its next step and the project it was making goes to the Trash (the video isn't touched)
$("cancelscan").onclick = async () => {
  const pid = PID;
  if (!pid || !(await Dialog.ask(t("scan.cancel.ask"), t("scan.cancel.ok"), { danger: true, cancel: t("scan.cancel.keep") }))) return;
  await api(`/api/projects/${pid}/cancel`, {});
  if (PID === pid) go("start");
};
function scanNote(st, i) {
  if (st.ready || (st.steps?.detect >= 1 && st.current === "review")) return STEP_HEAD.review;
  if (st.current === "prepare") return STEP_HEAD.prepare;
  if (st.current === "detect" && !i.frame) return t("scan.loading_models_html");
  if (st.current === "motion") return STEP_HEAD.motion;
  return t("scan.getting_ready");
}
// "Deciding who's who": the step drawn from what it is doing (decide_viz.js), in place of the preview
let VIZ = null, VIZ_N = 0, VIZ_POLL = null;
function vizStart(pid) {
  if (VIZ) return;
  clearInterval(previewTimer);
  $("preview").classList.add("hidden"); $("previewph").classList.add("hidden"); $("dvbox").classList.remove("hidden");
  $("stagecol").style.setProperty("--ar", 1.6);  // the drawing's own shape, whatever the video's
  VIZ = DecideViz.mount($("dvbox"), { head: vizHead(pid) }); VIZ_N = 0;
  const poll = async () => {
    if (!VIZ || PID !== pid) return;
    const r = await api(`/api/projects/${pid}/decide_viz?since=${VIZ_N}`).catch(() => null);
    if (r?.events?.length && VIZ) { VIZ.push(r.events); VIZ_N += r.events.length; }
    VIZ_POLL = setTimeout(poll, 500);
  };
  poll();
}
const vizHead = (pid) => ([t, x, y, s]) => `/api/projects/${encodeURIComponent(pid)}/head.jpg?t=${t}&x=${x}&y=${y}&s=${s}&px=120`;
function vizStop() {

  $("dvbox").classList.add("hidden"); $("dvbox").innerHTML = "";
}
async function vizFinish() {  // what's arrived is shown before the project opens (a few seconds at most)

  if (!FORMATS) return;
  const photo = FORMATS.photo;  // a photo exports as a photo: no trim, no sound
  $("trimrow").classList.toggle("hidden", !!photo); $("noteaudio").classList.toggle("hidden", !!photo);
  const detail = (p) => photo && p.id === "original" ? t("export.same_as_photo") : p.detail;
  $("formats").innerHTML = FORMATS.presets.map((p) => `<div class="style ${presetChoice === p.id ? "on" : ""}" data-k="${p.id}"><b>${p.label}</b><div class="dim small">${detail(p)}</div></div>`).join("");
  for (const el of document.querySelectorAll("#formats .style")) el.onclick = () => { presetChoice = el.dataset.k; drawFormats(); players.export.refresh(); };
  $("fitrow").classList.toggle("hidden", presetChoice === "original");
  $("fit-fill").classList.toggle("on", fitChoice === "fill"); $("fit-fit").classList.toggle("on", fitChoice === "fit");
  const [w, h] = FORMATS.sizes[presetChoice][fitChoice];
  if (photo) return void ($("outsummary").textContent = `${w}×${h} · ${t("export.out_photo")}`);
  const s0 = Math.max(0, +$("tstart").value || 0), s1 = Math.min(FORMATS.seconds, +$("tend").value || FORMATS.seconds);
  const len = Math.max(0, s1 - s0);
  $("outsummary").textContent = `${w}×${h} · ${len >= 60 ? t("unit.min_s", { m: Math.floor(len / 60), s: Math.round(len % 60) }) : t("unit.s", { n: len.toFixed(1) })} · ${t("export.out_video")}` +
    (len > 180 && presetChoice !== "original" ? " · " + t("export.too_long") : "");
}
$("fit-fill").onclick = () => { fitChoice = "fill"; drawFormats(); players.export.refresh(); };
$("fit-fit").onclick = () => { fitChoice = "fit"; drawFormats(); players.export.refresh(); };
$("tstart").oninput = () => { drawFormats(); if (S && +$("tstart").value >= 0) players.export.seek(Math.min(S.n - 1, Math.round(+$("tstart").value * S.fps))); };
$("tend").oninput = () => drawFormats();
// the corner mark: remembered per project (edits.watermark, bookkeeping that ⌘Z skips), off unless chosen
$("mark").onchange = async () => {
  players.export.refresh();
  await commitEdits((e) => { e.watermark = $("mark").checked; }, "Mark", { undoable: false });
};
$("strict").onchange = async () => {
  if (strict()) {
    styleChoice = "solid";
    const left = await openMisses();
    if (left) Dialog.tell(t("export.strict_open", { n: left }));
  }
  drawStyles();
};
$("export").onclick = async () => {
  if (strict()) {
    const left = await openMisses();
    if (left) { await Dialog.tell(t("export.strict_block", { n: left })); return go("decisions"); }
  }
  const opts = { style: styleChoice, strict: strict(), preset: presetChoice, fit: fitChoice, start: $("tstart").value, end: $("tend").value, mark: $("mark").checked };
  // save where the person chooses (default: next to the original): the app's own Save dialog, or in a browser on
  // this Mac the server asks macOS for one; elsewhere it goes to the project folder and is downloaded
  if (!FORMATS) await loadFormats();  // the clip's name and folder, for the suggested file
  const label = { original: "", vertical: "_9x16", portrait: "_4x5", square: "_1x1", landscape: "_16x9" }[presetChoice] || "";
  const dir = FORMATS && FORMATS.save_dir != null ? FORMATS.save_dir : (FORMATS && FORMATS.video || "").replace(/\/[^/]*$/, "");  // "": Movies
  const name = t("export.file_name", { name: (FORMATS && FORMATS.name) || t("export.file_name_default"), format: label, ext: FORMATS && FORMATS.photo ? "jpg" : "mp4" });
  if (NATIVE) {
    const out = await NATIVE.save_video(name, dir);
    if (!out) return;
    opts.out = out;
  } else {
    $("exportstatus").textContent = t("export.choose_where");
    const c = await api(P("/api/choose_output"), { name, dir });
    $("exportstatus").textContent = "";
    if (c.cancel) return;
    if (c.path) opts.out = c.path;
  }
  $("export").disabled = true;
  await api(P("/api/render"), opts);  // (a refusal shows in the poll's reply)
  const poll = async () => {
    try {
      const r = await api(P("/api/render"));
      if (r.status === "rendering") { $("exportstatus").textContent = t("export.progress", { pct: Math.round(r.progress * 100) }); return setTimeout(poll, 700); }
      $("export").disabled = false;
      if (r.status === "done" && r.path && (NATIVE || !r.file)) {  // saved where they chose
        $("exportstatus").innerHTML = `${t("export.saved", { name: esc(r.path.split("/").pop()) })} · <a class="act" id="reveal">${t("common.show_in_finder")}</a>`;
        $("exportstatus").title = r.path;
        $("reveal").onclick = () => NATIVE ? NATIVE.reveal(r.path) : api(P("/api/reveal"), {});
      } else if (r.status === "done") {
        $("exportstatus").innerHTML = `${t("export.done")} · <a href="${P("/" + r.file)}" download>${FORMATS && FORMATS.photo ? t("export.download_photo") : t("export.download_video")}</a>` +
          ` · <a class="act" id="reveal">${t("common.show_in_finder")}</a>`;
        $("reveal").onclick = () => api(P("/api/reveal"), {});
      } else $("exportstatus").textContent = r.error ? t("export.err.failed", { error: r.error }) : r.status;
    } catch (err) {  // (whatever went wrong, the button comes back)
      $("export").disabled = false;
      $("exportstatus").textContent = t("export.err.failed", { error: err.message });
    }
  };
  poll();
};

drawIcons(); show("start"); loadRecent();
{ const m = location.hash.match(/vizreplay=([^&]+)(?:&x=([\d.]+))?/); if (m) vizReplay(decodeURIComponent(m[1]), +(m[2] || 1)); }
</script>
</body>
</html>
